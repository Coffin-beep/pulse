<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0913">
  <title>Pulse — мессенджер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%23140f21'/%3E%3Cpath%20d='M3%2012h4l2-7%205%2014%202-7h5'%20stroke='%23a78bfa'%20stroke-width='2'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <div class="boot-splash">
      <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 5 14 2-7h5"/></svg>
      <div class="boot-splash__text">Pulse</div>
    </div>
  </div>
  <script>
    // если через 7 секунд приложение не загрузилось — подсказка вместо вечного сплэша
    setTimeout(function () {
      if (!window.__pulseBooted) {
        var splash = document.querySelector('.boot-splash');
        if (splash) {
          splash.insertAdjacentHTML('beforeend',
            '<div class="boot-splash__hint">Сервер не отвечает.<br>Проверь, что он запущен (node server.js), и обнови страницу</div>');
        }
      }
    }, 7000);
  </script>
  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#120e1d;color:#ece8f8;font-family:sans-serif;padding:24px;text-align:center">
      Для работы Pulse нужен включённый JavaScript 🙏
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
